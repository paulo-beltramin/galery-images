<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Galeria de fotos</title>
</head>

<body>
    <main>
        <!-- cabeçalho -->
        <header class="container-header">
            <p class="title">
                Galeria de fotos
            </p>

            <button class="btn" id="btn-header">
                Carregar imagem
            </button>
        </header>

        <!-- conteudo com as imagens -->
        <section class="container-forms" id="forms">
            <p>
                Insira nova imagem
            </p>

            <form class="forms">
                <input type="url" placeholder="Url da imagem " id="input">

                <button type="submit">Adicionar</button>
                <button class="btn-remove" id="to-close">Cancelar</button>
            </form>
        </section>


        <section class="container-images">
            <ul class="list" id="list"> </ul>
        </section>

    </main>


    <!-- fim do codigo -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./script.js"></script>
</body>
 
</html>
